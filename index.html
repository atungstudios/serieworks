<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serieworks - Apps for Life</title>
    <meta name="description" content="Thoughtfully crafted apps for learning, budgeting, fitness and everyday life. Download on the App Store, or join our Android beta program.">
    <link rel="canonical" href="https://serieworks.com/">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://serieworks.com/">
    <meta property="og:title" content="Serieworks - Apps for Life">
    <meta property="og:description" content="Thoughtfully crafted apps for learning, budgeting, fitness and everyday life. Download on the App Store, or join our Android beta program.">
    <meta property="og:image" content="https://serieworks.com/assets/og-image.jpg">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Serieworks - Apps for Life">
    <meta name="twitter:description" content="Thoughtfully crafted apps for learning, budgeting, fitness and everyday life. Download on the App Store, or join our Android beta program.">
    <meta name="twitter:image" content="https://serieworks.com/assets/og-image.jpg">
    <link rel="stylesheet" href="styles.css?v=12">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="nav.js?v=8"></script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Serieworks",
      "url": "https://serieworks.com",
      "logo": "https://serieworks.com/assets/logo.svg",
      "description": "Thoughtfully crafted apps for learning, budgeting, fitness and everyday life. Download on the App Store, or join our Android beta program.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "serieworks@gmail.com",
        "contactType": "customer support"
      }
    }
    </script>
</head>
<body>
    <header class="header"></header>

    <main>
        <div class="container">
            <div class="feature-banner">
                <img id="featureBannerImg"
                     src="assets/feature/feature-01.jpg" 
                     alt="Serieworks feature illustration" 
                     width="1500" 
                     height="500" />
                <span class="feature-banner-text">Apps for Life.</span>
            </div>
            <script>
            (function () {
                const features = [
                    'feature-01.jpg', 'feature-02.jpg', 'feature-03.jpg', 'feature-04.jpg',
                    'feature-05.jpg', 'feature-06.jpg', 'feature-07.jpg', 'feature-08.jpg',
                    'feature-09.jpg', 'feature-10.jpg', 'feature-11.jpg', 'feature-12.jpg'
                ];
                const img = document.getElementById('featureBannerImg');
                if (img) {
                    img.src = 'assets/feature/' + features[Math.floor(Math.random() * features.length)];
                }
            })();
            </script>
            <div class="controls">
                <input type="text" 
                       id="searchInput" 
                      placeholder="Search apps..." 
                      aria-label="Search apps">
                <select id="categoryFilter" aria-label="Filter by category">
                    <option value="all">All</option>
                    <option value="educational">Educational</option>
                    <option value="game">Game</option>
                    <option value="productivity">Productivity</option>
                    <option value="social">Social</option>
                    <option value="health">Health & Fitness</option>
                    <option value="finance">Finance</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="utilities">Utilities</option>
                    <option value="lifestyle">Lifestyle</option>
                    <option value="news">News</option>
                    <option value="travel">Travel</option>
                </select>
            </div>
            <div id="projectsGrid" class="grid grid-compact" role="main" aria-live="polite"></div>
        </div>
    </main>

    <div class="page-dim" aria-hidden="true"></div>

    <button id="backToTop" 
            class="back-to-top" 
            title="Back to top"
            aria-label="Scroll to top">
        &#11014;
    </button>

    <footer class="footer"></footer>

    <!-- QR Code Modal -->
    <div id="qrModal" class="qr-modal" style="display: none;">
        <div class="qr-modal-content">
            <div class="qr-modal-header">
                <h3 id="qrModalTitle">Get Mobile App</h3>
                <button class="qr-modal-close" aria-label="Close modal">&times;</button>
            </div>
            <div class="qr-modal-body">
                <p>Scan the QR code with your mobile device to download the app:</p>
                <div class="qr-code-container">
                    <div id="qrCodeImage"></div>
                </div>
                <div class="qr-modal-links">
                    <p>Or visit directly:</p>
                    <a id="qrAppStoreLink" href="#" target="_blank" class="qr-store-link">
                        <img src="assets/app-store-badge.svg" alt="Download on the App Store" class="qr-badge">
                    </a>
                    <a id="qrPlayStoreLink" href="#" target="_blank" class="qr-store-link" style="display: none;">
                        <img src="assets/google-play-badge.svg" alt="Get it on Google Play" class="qr-badge">
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js?v=5"></script>
</body>
</html>
